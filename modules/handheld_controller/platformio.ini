; Sauna Boat – Handheld Controller Module
; ESP32-S3 (Pavloff board) — custom handheld with analog joystick, SSD1306
; OLED display, MPU-6050 accelerometer (wake-on-motion), and LiPo battery.
; Broadcasts MSG_CONTROLLER_INPUT and MSG_SET_STEERING over ESP-NOW on the
; same channel as the rest of the mesh — a drop-in alternative to the
; historical external input device.
;
; Wiring (Pavloff board fixed pins):
;   MPU-6050 SDA → GPIO 8       OLED shares the same I2C bus
;   MPU-6050 SCL → GPIO 9
;   MPU-6050 INT → GPIO 18      EXT1 wake source
;   Battery ADC  → GPIO 7       (27k / 68k divider)
;   Status LED   → GPIO 47
;
; Wiring (joystick — assign to whatever ADC1-capable pins are free on your
; build; defaults below match the firmware):
;   Joystick VRx → GPIO 4       (ADC1_CH3)
;   Joystick VRy → GPIO 5       (ADC1_CH4)
;   Joystick SW  → GPIO 6       (digital, INPUT_PULLUP — active LOW)
;
; Build & flash:    pio run -t upload
; Serial monitor:   pio device monitor

[env:handheld_controller]
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.upstream_packages = no
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I../../shared
lib_deps =
    electroniccats/MPU6050@^1.0.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
