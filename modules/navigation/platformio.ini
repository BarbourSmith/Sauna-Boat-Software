; Sauna Boat – Navigation Module
; Plain ESP32 with BMM150 magnetometer (I2C) and NEO-6M GPS (UART2).
; Reads heading and position, broadcasts over ESP-NOW (MSG_NAV_STATUS).
;
; Wiring:
;   BMM150  SDA  → GPIO 21  (default I2C SDA)
;   BMM150  SCL  → GPIO 22  (default I2C SCL)
;   NEO-6M  TX   → GPIO 16  (UART2 RX)
;   NEO-6M  RX   → GPIO 17  (UART2 TX)
;
; Build & flash: pio run -t upload
; Serial monitor: pio device monitor

[env:navigation]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../../shared
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    dfrobot/DFRobot_BMM150@^1.0.0
