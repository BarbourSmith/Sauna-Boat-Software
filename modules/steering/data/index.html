<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sauna Boat – Steering</title>
  <style>
    :root {
      --bg:      #0d1b2a;
      --panel:   #1b2d42;
      --accent:  #00b4d8;
      --text:    #e0e0e0;
      --subtext: #8fa8c0;
      --green:   #4ade80;
      --red:     #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 24px;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Status pill ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.82rem;
    }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }
    #status-dot.connected { background: var(--green); }
    #status-text { color: var(--subtext); }

    /* ── Main card ── */
    .card {
      background: var(--panel);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--subtext);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Joystick ── */
    #joystick-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(0, 180, 216, 0.07);
      border: 2px solid rgba(0, 180, 216, 0.35);
      touch-action: none;
      cursor: grab;
    }
    #joystick-wrap:active { cursor: grabbing; }

    /* Cross-hair guide lines */
    #joystick-wrap::before,
    #joystick-wrap::after {
      content: '';
      position: absolute;
      background: rgba(0, 180, 216, 0.15);
    }
    #joystick-wrap::before {
      width: 1px; height: 100%;
      left: 50%; top: 0;
    }
    #joystick-wrap::after {
      width: 100%; height: 1px;
      top: 50%; left: 0;
    }

    #joystick-puck {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #29d6f5, var(--accent));
      box-shadow: 0 0 18px rgba(0, 180, 216, 0.55);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: transform;
    }
    #joystick-puck.snap {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Speed readout ── */
    #speed-display {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
      min-width: 120px;
      text-align: center;
    }
    #speed-display.active { color: #fff; }

    /* ── Direction label ── */
    #direction-label {
      font-size: 0.8rem;
      color: var(--subtext);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      height: 1em;
    }

    /* ── Settings button ── */
    #settings-btn {
      background: var(--panel);
      color: var(--subtext);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #settings-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Settings panel ── */
    #settings-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
    }
    #settings-panel h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 0.8rem;
      color: var(--subtext);
    }
    .field input[type="number"], .field input[type="range"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.95rem;
      width: 100%;
      -webkit-user-select: text;
      user-select: text;
    }
    .field input[type="range"] { padding: 4px 0; cursor: pointer; }
    .field .hint {
      font-size: 0.75rem;
      color: var(--subtext);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }

    /* ── Checkbox field ── */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
    }
    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Status bar -->
  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>

  <!-- Joystick card -->
  <div class="card">
    <h2>Steering Control</h2>

    <div id="joystick-wrap">
      <div id="joystick-puck"></div>
    </div>

    <div id="speed-display">0%</div>
    <div id="direction-label">&nbsp;</div>
  </div>

  <!-- Settings -->
  <button id="settings-btn" onclick="toggleSettings()">⚙ Settings</button>

  <div id="settings-panel">
    <h3>Settings</h3>
    <div class="field">
      <label for="maxspeed-range">Max speed (PWM 0 – 1023)</label>
      <input type="range" id="maxspeed-range" min="0" max="1023" step="1" value="512"
             oninput="document.getElementById('maxspeed-num').value=this.value" />
      <input type="number" id="maxspeed-num" min="0" max="1023" step="1" value="512"
             oninput="document.getElementById('maxspeed-range').value=this.value"
             style="margin-top:4px;" />
      <span class="hint">PWM output when joystick is fully deflected.</span>
    </div>
    <div class="field">
      <label for="snaptimeout-range">Inactivity snap-back (50 – 5000 ms)</label>
      <input type="range" id="snaptimeout-range" min="50" max="5000" step="50" value="100"
             oninput="document.getElementById('snaptimeout-num').value=this.value" />
      <input type="number" id="snaptimeout-num" min="50" max="5000" step="50" value="100"
             oninput="document.getElementById('snaptimeout-range').value=this.value"
             style="margin-top:4px;" />
      <span class="hint">Joystick recenters if touch stops moving for this long.</span>
    </div>
    <div class="field">
      <label for="rampms-range">Speed ramp time (0 – 2000 ms)</label>
      <input type="range" id="rampms-range" min="0" max="2000" step="50" value="500"
             oninput="document.getElementById('rampms-num').value=this.value" />
      <input type="number" id="rampms-num" min="0" max="2000" step="50" value="500"
             oninput="document.getElementById('rampms-range').value=this.value"
             style="margin-top:4px;" />
      <span class="hint">Time to ramp from stop to full speed. 0 = instant.</span>
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="dir-reverse" />
        Reverse motor direction
      </label>
      <span class="hint">Swaps which way the motor spins for left and right commands.</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="toggleSettings()">Cancel</button>
      <button class="btn btn-primary"   onclick="saveSettings()">Save</button>
    </div>
    <a href="/update" style="font-size:0.78rem; color:var(--subtext); text-align:center; margin-top:4px;">⬆ Firmware update</a>
  </div>

  <script>
    // ── Constants ─────────────────────────────────────────────────────────
    const PAD_RADIUS          = 100;   // half the 200 px pad
    const PUCK_RADIUS         = 35;    // half the 70 px puck
    const MAX_TRAVEL          = PAD_RADIUS - PUCK_RADIUS;   // 65 px
    const SEND_THROTTLE_MS    = 50;    // max send rate while dragging (20 Hz)
    const HEARTBEAT_INTERVAL_MS = 100; // keep-alive send interval (ms) — firmware watchdog is 200 ms
    const RECONNECT_DELAY_MS  = 3000;  // wait before reconnect attempt (ms)
    const SPEED_THRESHOLD     = 0.02;  // minimum speed to show direction label

    // ── DOM refs ──────────────────────────────────────────────────────────
    const pad         = document.getElementById('joystick-wrap');
    const puck        = document.getElementById('joystick-puck');
    const speedDisp   = document.getElementById('speed-display');
    const dirLabel    = document.getElementById('direction-label');
    const statusDot   = document.getElementById('status-dot');
    const statusText  = document.getElementById('status-text');

    // ── State ─────────────────────────────────────────────────────────────
    let dragging          = false;
    let currentSpeed      = 0;       // -1.0 … 1.0
    let lastSendTime      = 0;
    let ws                = null;
    let reconnectTimer    = null;
    let inactivityTimer   = null;    // auto-recenter if touch stops moving
    let snapTimeoutMs     = 100;     // loaded from /settings (default 100 ms)

    // ── Helpers ───────────────────────────────────────────────────────────
    function clampToPad(x, y) {
      const dist = Math.sqrt(x * x + y * y);
      if (dist > MAX_TRAVEL) {
        return { x: (x / dist) * MAX_TRAVEL, y: (y / dist) * MAX_TRAVEL };
      }
      return { x, y };
    }

    function relativePos(e) {
      const rect = pad.getBoundingClientRect();
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;
      return { x: e.clientX - cx, y: e.clientY - cy };
    }

    function updatePuck(rawX, rawY) {
      const { x, y } = clampToPad(rawX, rawY);
      puck.classList.remove('snap');
      // Offset from centre expressed as CSS translate (centre of puck is at 50%/50%)
      puck.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

      // Horizontal axis → steering speed
      const speed = x / MAX_TRAVEL;
      currentSpeed = speed;
      refreshSpeedDisplay(speed);
      throttledSend(speed);
    }

    function refreshSpeedDisplay(speed) {
      const pct = Math.round(Math.abs(speed) * 100);
      speedDisp.textContent = pct + '%';
      speedDisp.classList.toggle('active', pct > 0);
      if (speed > SPEED_THRESHOLD)        dirLabel.textContent = '▶  Steer right';
      else if (speed < -SPEED_THRESHOLD)  dirLabel.textContent = '◀  Steer left';
      else                                dirLabel.textContent  = '';
    }

    function throttledSend(speed) {
      const now = Date.now();
      if (now - lastSendTime >= SEND_THROTTLE_MS) {
        sendSpeed(speed);
        lastSendTime = now;
      }
    }

    function sendSpeed(speed) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ speed: speed }));
      }
    }

    function snapBack() {
      puck.classList.add('snap');
      puck.style.transform = 'translate(-50%, -50%)';
      currentSpeed = 0;
      refreshSpeedDisplay(0);
      sendSpeed(0);
      lastSendTime = Date.now();
      clearInactivityTimer();
    }

    // ── Inactivity snap-back ───────────────────────────────────────────────
    // If the touch/pointer stops moving while dragging, treat it as a release.
    function resetInactivityTimer() {
      clearInactivityTimer();
      if (!dragging) return;
      inactivityTimer = setTimeout(function () {
        if (dragging) {
          dragging = false;
          snapBack();
        }
      }, snapTimeoutMs);
    }

    function clearInactivityTimer() {
      if (inactivityTimer) { clearTimeout(inactivityTimer); inactivityTimer = null; }
    }

    // ── Joystick: pointer events (mouse + touch + stylus unified) ─────────
    // Using the Pointer Events API ensures pointercancel fires when an OS
    // gesture, notification, or other interruption steals the touch — which
    // would silently leave the joystick stuck under the old touch/mouse model.
    // setPointerCapture guarantees pointerup/pointercancel are always delivered
    // even when the finger moves outside the element.
    pad.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      pad.setPointerCapture(e.pointerId);
      dragging = true;
      const { x, y } = relativePos(e);
      updatePuck(x, y);
      resetInactivityTimer();
    });

    pad.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      e.preventDefault();
      const { x, y } = relativePos(e);
      updatePuck(x, y);
      resetInactivityTimer();
    });

    function onPointerEnd() {
      if (!dragging) return;
      dragging = false;
      clearInactivityTimer();
      snapBack();
    }

    pad.addEventListener('pointerup',     onPointerEnd);
    pad.addEventListener('pointercancel', onPointerEnd);  // OS/browser interruption

    // ── Heartbeat ─────────────────────────────────────────────────────────
    // Keep the firmware watchdog alive when joystick is held non-zero.
    setInterval(function () {
      sendSpeed(currentSpeed);
    }, HEARTBEAT_INTERVAL_MS);

    // ── WebSocket ─────────────────────────────────────────────────────────
    function connect() {
      // Cancel any pending retry timer.
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

      // Detach handlers from the old socket so stale close/error events
      // can't race with the new connection and spawn extra retry timers.
      if (ws) {
        ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      }

      const host = window.location.hostname;
      ws = new WebSocket('ws://' + host + '/ws');

      ws.onopen = function () {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
      };

      ws.onclose = function () {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected – reconnecting…';
        snapBack();
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY_MS);
      };

      ws.onerror = function () { ws.close(); };

      // Server broadcasts are intentionally ignored for speed state.
      // The client is the sole authority on what speed it is commanding.
      // Echoing server speed back into currentSpeed caused a race condition:
      // after snapBack() the firmware could broadcast the stale non-zero speed
      // just before it processed the speed=0 message, resetting currentSpeed to
      // non-zero while the puck was already visually centred — and then the
      // heartbeat would re-send that stale speed to the motor.
      ws.onmessage = function () {};
    }

    // ── Settings ──────────────────────────────────────────────────────────
    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      const isOpen = panel.style.display === 'flex';
      if (!isOpen) loadSettings();
      panel.style.display = isOpen ? 'none' : 'flex';
    }

    function loadSettings() {
      fetch('/settings')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          const v = data.maxSpeed !== undefined ? data.maxSpeed : 512;
          document.getElementById('maxspeed-range').value = v;
          document.getElementById('maxspeed-num').value   = v;

          const t = data.snapTimeout !== undefined ? data.snapTimeout : 100;
          document.getElementById('snaptimeout-range').value = t;
          document.getElementById('snaptimeout-num').value   = t;

          const r = data.rampMs !== undefined ? data.rampMs : 500;
          document.getElementById('rampms-range').value = r;
          document.getElementById('rampms-num').value   = r;

          document.getElementById('dir-reverse').checked =
            data.dirReverse !== undefined ? data.dirReverse : false;
        })
        .catch(function (e) { console.warn('Failed to load settings:', e); });
    }

    function saveSettings() {
      const maxSpeed    = parseInt(document.getElementById('maxspeed-num').value, 10);
      const snapTimeout = parseInt(document.getElementById('snaptimeout-num').value, 10);
      const rampMs      = parseInt(document.getElementById('rampms-num').value, 10);
      const dirReverse  = document.getElementById('dir-reverse').checked;
      fetch('/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ maxSpeed: maxSpeed, snapTimeout: snapTimeout, rampMs: rampMs, dirReverse: dirReverse })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.ok) {
            snapTimeoutMs = snapTimeout;  // apply immediately
            document.getElementById('settings-panel').style.display = 'none';
          }
        })
        .catch(function (e) { console.warn('Failed to save settings:', e); });
    }

    // ── No-sleep: keep screen on via looping silent video ─────────────────
    (function noSleep() {
      const v = document.createElement('video');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('muted', '');
      v.setAttribute('loop', '');
      v.muted  = true;
      v.volume = 0;
      v.style.cssText = 'position:fixed;top:-2px;left:-2px;width:2px;height:2px;pointer-events:none;';
      v.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAArJtZGF0AAACrQYF//+p3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0MiByMjQ3OSBkZDE5NTA0IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNSAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiBXaXphcmQ9MSBiZnJhbWVzPTMgYl9weXJhbWlkPTIgYl9hZGFwdD0xIGJfYmlhcz0wIGRpcmVjdD0xIHdlaWdodGI9MSBvcGVuX2dvcD0wIHdlaWdodHA9MiBrZXlpbnQ9MjUwIGtleWludF9taW49MjUgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTI4LjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAFZZYiEAD//8m+P5OXfsy7hsAKFCcrGH2VHBFuG3ZTtPmvtZQAAAwAeZ5QAAAMABP4AAAMAAkgAAAAPQZokbEP//hQAAAAIQZpFeeEO//gAAAAIQZpmeeEO//gAAAAIQZqHeeEO//gAAAAIQZqoeeEO//gAAAAOQZrJeeEO//gAAABtbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAABdwAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAlt0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAABdwAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAQAAAAEAAAADBHRtZWRpYQAAABBtZGhkAAAAAAAAAAAAAAAAAAA8AAAAFgBVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAAAVaWRlbwAAAAIAbWluZgAAABR2bWhkAAAAAQAAAAAAAAAAAAAAJGRpbmYAAAAcZHJlZgAAAAAAAAABAAAADHVybCAAAAABAAAAgHN0YmwAAAAYc3RzZAAAAAAAAAABAAAACGF2YzEAAAA1c3R0cwAAAAAAAAABAAAAFgAADAAAAAAUc3RzcwAAAAAAAAABAAAAATAAAABYY3R0cwAAAAAAAAAWAAAACgAAABgAAAABAAAAFAAAAAEAAAAYAAAAAgAAABQAAAABAAAAGAAAAAEAAAAUAAAAAQAAABgAAAABAAAAFAAAAAEAAAAYAAAAAgAAABQAAAABAAAAGAAAAAEAAAAUAAAAFHN0c2MAAAAAAAAAAQAAAAEAAAAWAAAAAQAAAJRZYW4AAAABAAAS8HN0c3oAAAAAAAAAAAAAABYAAAIAAAAQAAAADAAAAAwAAAAMAAAADAAAAAwAAAAMAAAADAAAAAwAAAAMAAAADAAAAAwAAAAMAAAADAAAAAwAAAAMAAAADAAAAAwAAAAMAAAADHN0Y28AAAAAAAAAAQAAACwAAAB       document.body.appendChild(v);
      function tryPlay() { v.play().catch(function () {}); }
      document.addEventListener('touchstart', tryPlay, { passive: true, once: true });
      v.addEventListener('pause', tryPlay);
      v.addEventListener('ended', tryPlay);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') tryPlay();
      });
    })();

    // ── Reconnect on screen wake / network restore ─────────────────────────
    // Mobile browsers freeze JS when the screen locks. On wake, attempt an
    // immediate reconnect rather than waiting for the 3-second retry timer.
    function reconnectIfNeeded() {
      if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
        connect();
      }
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reconnectIfNeeded();
    });
    window.addEventListener('online', reconnectIfNeeded);

    // ── Init ──────────────────────────────────────────────────────────────
    // Load snapTimeout from firmware before connecting so the inactivity timer
    // uses the persisted value immediately.
    fetch('/settings')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.snapTimeout !== undefined) snapTimeoutMs = data.snapTimeout;
      })
      .catch(function () {});  // non-fatal; default value is already set

    connect();
  </script>
</body>
</html>
