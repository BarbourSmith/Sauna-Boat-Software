; Sauna Boat – Steering Module
; ESP32-S3 on Maslow 4 control board
;
; Build & flash:   pio run -t upload        (USB)
;                  pio run -t meshupload    (over the mesh, through the handheld's USB port)
; Serial monitor:  pio device monitor

[env:steering]
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.upstream_packages = no
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
upload_port = /dev/cu.usb*
monitor_port = /dev/cu.usb*
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I../../shared
    -URGB_BUILTIN          ; prevent board-init from claiming GPIO 48 via RMT for the DevKitC RGB LED
extra_scripts = post:../../tools/mesh_gateway/pio_targets.py
custom_mesh_module = steering
lib_deps =
    Update                 ; firmware updates over the mesh (shared/mesh_remote.h)
