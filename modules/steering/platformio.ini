; Sauna Boat – Steering Module
; ESP32-S3 on Maslow 4 control board
;
; Build & flash:   pio run -t upload
; Flash filesystem: pio run -t uploadfs
; Serial monitor:  pio device monitor

[env:steering]
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.upstream_packages = no
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I../../shared
    -URGB_BUILTIN          ; prevent board-init from claiming GPIO 48 via RMT for the DevKitC RGB LED
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
