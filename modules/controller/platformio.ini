; Sauna Boat – Controller Module
; Plain ESP32 (not S3) with PS3 DualShock 3 controller via Bluetooth.
; Reads the left analog stick and sends heading commands to the steering
; module over ESP-NOW.
;
; IMPORTANT – one-time pairing step:
;   1. Flash this firmware and open the serial monitor.
;   2. Note the "Bluetooth MAC" printed on startup.
;   3. Use SixaxisPairTool (Windows/Mac) or sixaxispairer (Linux) to write
;      that MAC address into your PS3 controller.
;   4. Press the PS button on the controller — it will connect automatically.
;
; Build & flash: pio run -t upload
; Serial monitor: pio device monitor

[env:controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; PS3 (Bluetooth) + WiFi (ESP-NOW) combined exceed the default 1.25 MB app
; partition.  huge_app.csv gives ~3 MB to the application with no OTA or
; filesystem partitions — both of which the controller module doesn't need.
board_build.partitions = huge_app.csv
build_flags =
    -I../../shared
lib_deps =
    https://github.com/jvpernis/esp32-ps3
