; Sauna Boat Auto Steering System
; PlatformIO Project Configuration for ESP32-S3 (Maslow 4 control board)

[platformio]
src_dir = src
data_dir = data
default_envs = steering

[env:steering]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
