; Sauna Boat – Root workspace configuration
;
; Each module lives in its own subdirectory under modules/ and has its own
; platformio.ini.  Open the module's folder directly in VS Code / PlatformIO
; to build and flash it, or use the commands below from the repo root.
;
; Flash steering module:
;   cd modules/steering && pio run -t upload && pio run -t uploadfs
;
; Flash controller module:
;   cd modules/controller && pio run -t upload
;
; See README.md for the full project architecture.
