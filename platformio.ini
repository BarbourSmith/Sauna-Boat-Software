; Sauna Boat – Steering Module (speed-based, root workspace)
; ESP32-S3 on Maslow 4 control board
;
; This is the active speed-based steering firmware built from src/.
; For the angle/PID variant see modules/steering/.
; For the handheld input module see modules/handheld_controller/.
;
; Build & flash:    pio run -t upload        (USB)
;                   pio run -t meshupload    (over the mesh, through the handheld's USB port)
; Serial monitor:   pio device monitor

[platformio]
src_dir  = src
default_envs = steering

[env:steering]
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.upstream_packages = no
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I shared
extra_scripts = post:tools/mesh_gateway/pio_targets.py
custom_mesh_module = steering
lib_deps =
    Update                 ; firmware updates over the mesh (shared/mesh_remote.h)
